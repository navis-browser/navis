<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  id="desktop-embedder-shell"
  windowtype="desktop-embedder:test-shell"
  width="900"
  height="640"
>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Desktop Gecko Embedder test shell</title>
    <style>
      html,
      body {
        box-sizing: border-box;
        display: flex;
        flex: 1;
        flex-direction: column;
        height: 100%;
        margin: 0;
        min-height: 0;
      }

      #status {
        background: #20242b;
        color: #f3f5f7;
        font: menu;
        padding: 8px 12px;
      }

      #view-host {
        display: flex;
        flex: 1;
        min-height: 0;
      }
    </style>
    <script type="module" src="./bootstrap.mjs"></script>
  </head>
  <body>
    <output id="status">Starting Desktop Gecko Embedder…</output>
    <main id="view-host"></main>
  </body>
</html>
