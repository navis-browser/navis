<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Navis history bridge test</title>
    <style>
      #history-target:link {
        color: rgb(192 0 0);
      }

      #history-target:visited {
        color: rgb(0 128 0);
      }
    </style>
  </head>
  <body>
    <h1>Navis history bridge test</h1>
    <a id="history-target" href="/history-target">History target</a>
    <output id="result">Starting history round trip…</output>
    <script>
      const link = document.querySelector("#history-target");
      const result = document.querySelector("#result");

      addEventListener("pageshow", () => {
        if (sessionStorage.getItem("navis-history-target-visited")) {
          const replacement = link.cloneNode(true);
          link.replaceWith(replacement);
          result.value = "History round trip complete";
          fetch("/report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: "history_roundtrip", value: true }),
          }).catch(() => {});
          return;
        }

        sessionStorage.setItem("navis-history-target-visited", "true");
        setTimeout(() => link.click(), 250);
      });
    </script>
  </body>
</html>
